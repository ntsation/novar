name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.areas.outputs.core }}
      python: ${{ steps.areas.outputs.python }}
      vscode: ${{ steps.areas.outputs.vscode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: areas
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: scripts/changed-areas.sh >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Examples are formatted
        run: cargo run -q -p telvax_cli -- fmt --check examples/rag-service.tvx examples/basics/primes.tvx examples/basics/sieve.tvx examples/hello-world/hello.tvx examples/dataframe/sales.tvx

  deny:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Native backend (MLIR + LLVM 22) and the PTX generator: tests and lints with the `llvm` feature.
  llvm:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM 22 with MLIR
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev libmlir-22-dev mlir-22-tools libzstd-dev libpolly-22-dev
      - run: . scripts/llvm-env.sh && cargo clippy --workspace --all-targets --features llvm
      - run: . scripts/llvm-env.sh && cargo test --workspace --features llvm

  # The GPU backend compiles everywhere; running its tests needs a GPU adapter, which hosted
  # runners do not have, so this job only builds and lints it.
  gpu:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p telvax_runtime -p telvax_cli --features telvax_cli/gpu --all-targets
      - run: cargo test -p telvax_runtime --features gpu --no-run

  # Windows runs the same tests as Linux.
  windows:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # The ~10 MB build without Arrow / DataFusion must keep compiling and passing its tests.
  lite:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p telvax_cli --no-default-features --features live

  # The Arrow Flight client is an optional feature, so the default tests do not build it.
  flight:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p telvax_runtime --features flight --test flight

  # The same tests as Linux and Windows, on macOS (Apple silicon). The runners have no GPU, so
  # the GPU tests do not run here either.
  macos:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Line coverage of the Rust workspace. The number goes to the job summary, and the job fails when
  # it drops below the floor in scripts/coverage-floor.txt.
  coverage:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --ignore-filename-regex 'tools/migrate/' --json --summary-only --output-path coverage.json
      - run: python3 scripts/coverage-gate.py coverage.json

  # Speed and memory gates: the RAG service must keep its overhead and footprint inside the alpha
  # targets (p99 under 15 ms, RSS under 30 MB) and the interpreter must not get much slower.
  benchmark:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p telvax_cli --no-default-features --features live
      - run: cargo build --release -p telvax_bench
      # Shared runners are noisy: one retry before calling it a regression.
      - name: RAG overhead and memory
        run: |
          target/release/rag_latency target/release/telvax --docs 2000 --check ||
            target/release/rag_latency target/release/telvax --docs 2000 --check
      - name: Interpreter speed
        run: benchmarks/speed.sh target/release/telvax
