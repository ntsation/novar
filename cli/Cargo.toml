[package]
name = "telvax_cli"
description = "Telvax: telvax_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "telvax"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
telvax_lint = { path = "../tools/linter" }
telvax_fmt = { path = "../tools/formatter" }
telvax_doc = { path = "../tools/doc" }
telvax_accel = { path = "../compiler/accel" }
telvax_codegen = { path = "../compiler/codegen", optional = true }
telvax_mlir = { path = "../compiler/ir", optional = true }
axum = "0.8.9"
telvax_diagnostics = { path = "../compiler/diagnostics" }
telvax_hir = { path = "../compiler/semantic" }
telvax_parser = { path = "../compiler/parser" }
telvax_runtime = { path = "../runtime", default-features = false }
telvax_server = { path = "../server" }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "macros", "signal"] }
telvax_lsp = { path = "../tools/lsp" }
telvax_repl = { path = "../tools/repl" }
rustyline = { version = "18", default-features = false, features = ["with-file-history"] }
telvax_dap = { path = "../tools/dap" }
telvax_pkg = { path = "../tools/package-manager" }
telvax_modules = { path = "../compiler/modules" }
serde = { version = "1.0.229", features = ["derive"] }
telvax_cluster = { path = "../tools/cluster" }

[features]
default = ["tables", "live"]
# Tables, CSV / Parquet and SQL (Arrow + DataFusion). Leaving it out makes a much smaller binary.
tables = ["telvax_runtime/tables"]
# Real Ollama / OpenAI / PostgreSQL backends (`--live`).
live = ["telvax_runtime/live"]
# Run tensor operations on the GPU (`--device gpu`) through wgpu.
gpu = ["telvax_runtime/gpu"]
# Arrow Flight client: `std.table.read_flight`, `write_flight`.
flight = ["telvax_runtime/flight"]
# Native backend (MLIR + LLVM 22). Needs LLVM installed; see scripts/llvm-env.sh.
llvm = ["telvax_accel/llvm", "dep:telvax_codegen", "dep:telvax_mlir", "telvax_codegen/llvm", "telvax_mlir/llvm"]

[dev-dependencies]
telvax_pkg = { path = "../tools/package-manager" }
serde_json = "1.0.154"
